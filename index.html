<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>meigetsu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            background: #000;
            color: #fff;
            font-family: Spectral, Helvetica, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            min-height: 100vh;
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 80px 30px;
        }

        header {
            margin-bottom: 40px;
        }

        h1 {
            margin: 0;
            font-size: 2.5rem;
            font-weight: 400;
        }

        .description {
            margin-top: 20px;
            line-height: 1.7;
        }

        nav {
            margin-top: 50px;
        }

        nav a {
            color: #fff;
            text-decoration: none;
            margin-right: 30px;
        }

        nav a:hover {
            text-decoration: underline;
        }
        .page {
    display: none;
    opacity: 0;
}

.page.active {
    display: block;
    animation: fadeIn 0.25s ease;
}

@keyframes fadeIn {
    from {
        opacity: 0;
        transform: translateY(5px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}
    </style>
</head>

<body>

    <main>

        <!-- Header -->
        <header>
            <h1>Meigetsu / 盟月</h1>
        </header>

        <!-- Description -->
        <section class="description">
            <p>a page for our friend group, basically.</p>
        </section>

        <!-- Subpages -->
        <nav>
            <a href="#"></a>
            <a href="#"></a>
            <a href="#about">About</a>
        </nav>
        
    <section id="">
        <h2></h2>
        <p></p>
    </section>

    <section id="">
        <h2></h2>
        <p></p>
    </section>

    <section id="about">
        <h2>About us!</h2>
        <p>dddice</p>
    </section>

    </main>

<script>
    function showPage() {
        let page = location.hash.substring(1) || "home";

        document.querySelectorAll(".page").forEach(function(element) {
            element.classList.remove("active");
        });

        let selected = document.getElementById(page);

        if (selected) {
            selected.classList.add("active");
        } else {
            document.getElementById("home").classList.add("active");
        }
    }

    window.addEventListener("hashchange", showPage);
    showPage();
</script>

</body>
</html>
